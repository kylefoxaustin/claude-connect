# Copy to settings.toml and edit. Conductor reads ./settings.toml at startup.

[server]
host = "127.0.0.1"
port = 8765
# Leave empty for the localhost-only default (no auth). Set a shared secret before
# exposing Conductor beyond this box (e.g. a phone over Tailscale) — every /api/*
# request and the /ws handshake will then require it. Can also be provided via the
# $CONDUCTOR_AUTH_TOKEN env var (which wins, so it needn't be written to disk).
# auth_token = ""

[scanner]
# Seconds between full process rescans. Inotify pushes mtime updates between scans.
interval_seconds = 3.0
# Glob roots searched for ~/.claude/projects/*. Override if you keep Claude state elsewhere.
claude_home = "~/.claude"

[bus]
# Adapter: "markdown" (the reference claude-bus), "jsonl" (generic), or "fake" (demo).
adapter = "markdown"

# Markdown adapter: append-only `## YYYY-MM-DD HH:MM [tag]` log.
markdown_path = "~/Documents/claude-bus/messages.md"
state_dir     = "~/.claude/bus-state"
script_path   = "~/.claude/bin/bus.sh"

# JSONL adapter (alternative): one event per line; see conductor/bus.py for schema.
jsonl_path = "~/.claude/bus.jsonl"

# Auto-delivery wakes an idle session that has an unread message addressed to it
# (to:<tag>), so you're not the fleet's courier. Exempt any session you don't want
# auto-prodded — typically the dashboard's own dev/operator console you work in.
# autodeliver = true
# autodeliver_exempt = ["[other:claude-connect]"]

# Web Push pages you on exactly two things by default: a session blocked on a question,
# and a gated `git push`. The dead-reader alarm (a tag others keep addressing that has
# itself gone silent for hours) is SURFACED in the UI but does not page — a third alarm
# is a deliberate opt-in. Set true to have it page your phone too.
# page_dead_readers = false

# Seconds of bus quiet before the bus tile dims.
idle_seconds = 30.0

# Sender tag stamped on messages you compose from the dashboard (Compose button),
# so they're distinct from any session. e.g. "operator" -> "[operator]".
sender_tag = "operator"

# A shared-resource lease whose owner has had no live session for this long is
# surfaced on its tile as an orphan ("⚠ owner offline", with a reclaim button).
# Conductor never reclaims on its own — a session can be closed and relaunched —
# so this only decides when to *offer you the choice*. The watchdog's separate
# after-reboot reaping is certain (a lease older than the boot) and needs no guess.
orphan_flag_seconds = 600.0

# Auto-delivery ("never be the courier"): when an IDLE session has an unread bus
# message addressed to it (to:<tag>), Conductor wakes it (injects /msg-check) so it
# reads it on its own — no more prodding sessions to check the bus. Only idle/dormant
# sessions (never busy, never one you may be typing at), only directed messages
# (broadcasts don't trigger it), once per batch. Set false to disable.
autodeliver = true

# Optional: map project directories to pretty tags, mirroring the case-table in
# your bus.sh so tiles show the same tag the bus uses. Unmapped dirs fall back to
# [other:<dirname>]. Use bare names (no brackets). Example:
# [bus.tags]
# "~/code/my-api" = "api"
# "~/code/my-web" = "web"

[ui]
# Seconds an ended session tile fades out before removal.
end_fadeout_seconds = 30.0

[relaunch]
# Click-to-relaunch a parked (dormant) session from the bottom dock: opens
# `claude --continue` in its folder (via scripts/claude-tracked) in a tracked
# terminal. By default that's the whole action — a clean resume, no keystrokes.
#
# Optionally, once the session is up, inject:
#   rc     — `/rc` = Claude Code's /remote-control (makes the session drivable
#            from a browser/phone; needs a qualifying plan + /login). ON by
#            default, so a relaunched session comes back remote-controllable and
#            visible in the phone app instead of looking crashed.
#   rename — `/rename <name>` after /rc. OFF by default: its injection is timing-
#            flaky (leading chars can drop and land as a stray message) and it
#            overwrites a session's own title (--continue keeps the prior name).
rc = true
rename = false
# How long to wait for the relaunched session to appear before giving up:
appear_timeout_seconds = 40.0
# Delay after the session appears before the first keystroke (lets the TUI draw):
settle_seconds = 2.5
# Gap between the /rc and /rename keystrokes:
between_seconds = 1.0
