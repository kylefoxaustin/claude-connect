<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Claude Connect">
  <defs>
    <radialGradient id="cc-bg" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#251a3d"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="cc-core" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#ead4ff"/>
      <stop offset="0.7" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </radialGradient>
    <filter id="cc-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cc-soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#cc-bg)"/>
  <rect x="6.75" y="6.75" width="242.5" height="242.5" rx="53.25" fill="none" stroke="#4a3a72" stroke-width="1.5" opacity="0.55"/>

  <!-- faint orbit ring through the session nodes -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.30"/>

  <!-- bus wires: core -> each session node (one bright wire carries a message) -->
  <g fill="none" stroke-linecap="round" filter="url(#cc-glow)">
    <line x1="128" y1="128" x2="128" y2="48"  stroke="#bc8cff" stroke-width="3"   opacity="0.55"/>
    <line x1="128" y1="128" x2="197" y2="88"  stroke="#f0c88a" stroke-width="4.5" opacity="0.95"/>
    <line x1="128" y1="128" x2="197" y2="168" stroke="#bc8cff" stroke-width="3"   opacity="0.5"/>
    <line x1="128" y1="128" x2="128" y2="208" stroke="#bc8cff" stroke-width="3"   opacity="0.55"/>
    <line x1="128" y1="128" x2="59"  y2="168" stroke="#bc8cff" stroke-width="3"   opacity="0.5"/>
    <line x1="128" y1="128" x2="59"  y2="88"  stroke="#bc8cff" stroke-width="3"   opacity="0.55"/>
  </g>

  <!-- a message pulse flying the bright wire -->
  <circle cx="173" cy="102" r="7" fill="#fff3cf" filter="url(#cc-glow)"/>
  <circle cx="173" cy="102" r="3.2" fill="#ffffff"/>

  <!-- session nodes (the app's tile/group palette) -->
  <g filter="url(#cc-glow)">
    <circle cx="128" cy="48"  r="12.5" fill="#e06c75"/>
    <circle cx="197" cy="88"  r="13.5" fill="#e5c07b"/>
    <circle cx="197" cy="168" r="12.5" fill="#98c379"/>
    <circle cx="128" cy="208" r="12.5" fill="#56b6c2"/>
    <circle cx="59"  cy="168" r="12.5" fill="#61afef"/>
    <circle cx="59"  cy="88"  r="12.5" fill="#ff79c6"/>
  </g>
  <g fill="#ffffff" opacity="0.82">
    <circle cx="124" cy="44"  r="3.6"/>
    <circle cx="193" cy="84"  r="4"/>
    <circle cx="193" cy="164" r="3.6"/>
    <circle cx="124" cy="204" r="3.6"/>
    <circle cx="55"  cy="164" r="3.6"/>
    <circle cx="55"  cy="84"  r="3.6"/>
  </g>

  <!-- the glowing bus core -->
  <circle cx="128" cy="128" r="36" fill="#bc8cff" opacity="0.38" filter="url(#cc-soft)"/>
  <circle cx="128" cy="128" r="23" fill="url(#cc-core)" filter="url(#cc-glow)"/>
  <circle cx="121" cy="120" r="6" fill="#ffffff" opacity="0.85"/>
</svg>
