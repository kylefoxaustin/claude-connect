[project]
name = "conductor"
version = "2.20.0"
description = "Local browser-based dashboard for monitoring concurrent Claude Code sessions"
requires-python = ">=3.10"
authors = [{ name = "Kyle Fox" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=5.9",
    "watchdog>=4.0",
    "websockets>=12.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
conductor = "conductor.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
